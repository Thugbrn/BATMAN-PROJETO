<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="shortcut icon" href="../ico/Batman-icon.ico" type="image/x-icon" />
    <title>Comentários</title>
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <script nomodule src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.js"></script>
    <link rel="stylesheet" href="./comentarios.css" />
</head>
<body>
    <header>
        <a href="../index.html">
            <img id="logo" src="../img/logo.jpeg" alt="Logo Batman">
        </a>        
        <nav>
            <ul>
                <li><a href="../index.html">Home</a></li>
                <li><a href="./contatos.html">Contato</a></li>
                <li><a href="./fotos.html">Fotos</a></li>
                <li><a href="./comentarios.html">Comentários</a></li>
            </ul>
        </nav>
    </header>
    <section class="contact">
        <div>
            <h2>Comentários</h2>
        </div>
        <div class="container">
            <div class="navbar">
                <button class="box" type="button" data-share aria-label="Compartilhar no Instagram">
                    <div class="icon instagram">
                        <ion-icon name="logo-instagram"></ion-icon>
                    </div>
                    <p>Instagram</p>                                       
                </button>
                <button class="box" type="button" data-share aria-label="Compartilhar no WhatsApp">
                    <div class="icon whatsapp">
                        <ion-icon name="logo-whatsapp"></ion-icon>
                    </div>
                    <p>Whatsapp</p>                                       
                </button>
                <button class="box" type="button" data-share aria-label="Compartilhar no Facebook">
                    <div class="icon facebook">
                        <ion-icon name="logo-facebook"></ion-icon>
                    </div>
                    <p>Facebook</p>                                       
                </button>
                <button class="box" type="button" data-share aria-label="Compartilhar no Twitter">
                    <div class="icon twitter">
                        <ion-icon name="logo-twitter"></ion-icon>
                    </div>
                    <p>Twitter</p>                                       
                </button>
            </div>
            <div class="Share">
                <h3>Compartilhe</h3>
                <p id="share-status" role="status" aria-live="polite"></p>
            </div>            
            <div class="contactForm">
                <form id="comment-form">
                    <h2>Deixe seu Comentário</h2>
                    <div class="inputBox">
                        <input type="text" name="nome" autocomplete="name" aria-label="Nome" required>
                        <span>Nome</span>
                    </div>
                    <div class="inputBox">
                        <textarea name="comentario" aria-label="Comentário" required></textarea>
                        <span>Digite seu Comentário...</span>
                    </div>
                    <div class="inputBox">
                        <input type="submit" value="Enviar">
                    </div>
                    <p id="comment-status" role="status" aria-live="polite"></p>
                </form>
            </div>
            <div class="comments-list" id="comments-list" aria-live="polite"></div>
        </div>        
    </section>
    <footer>
        <nav class="footer-navigation">
            <ul class="footer-list">
                <li><a href="../index.html">Home</a></li>
                <li><a href="./contatos.html">Contatos</a></li>
                <li><a href="./fotos.html">Fotos</a></li>
                <li><a href="./comentarios.html">Comentários</a></li>
            </ul>
        </nav>
    </footer>
    <script src="./interacoes.js" defer></script>
</body>
</html>
