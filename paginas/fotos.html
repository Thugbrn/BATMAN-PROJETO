    <main>
        <div class="text">
            <h2>Galeria</h2>
        </div>    
        <div class="gallery-container">
            <a href="../img/album/Bruce Wayne.jpg" class="gallery-items">
                <img src="../img/album/Bruce Wayne.jpg" alt="Bruce Warner">
            </a> 
            <a href="../img/album/Fiquei mais forte do que nunca.jpg" class="gallery-items">
                <img src="../img/album/Fiquei mais forte do que nunca.jpg" alt="Fiquei mais forte do que nunca">
            </a> 
            <a href="../img/album/GettyImages.jpg" class="gallery-items">
                <img src="../img/album/GettyImages.jpg" alt="GettyImages">
            </a> 
            <a href="../img/album/Gotham-Batman-e-Gordon.jpg" class="gallery-items">
                <img src="../img/album/Gotham-Batman-e-Gordon.jpg" alt="Gotham Batman e Gordon">
            </a> 
            <a href="../img/album/Jim Gordon.jpg" class="gallery-items">
                <img src="../img/album/Jim Gordon.jpg" alt="Jim Gordon">
            </a> 
            <a href="../img/album/mulher-gato.jpg" class="gallery-items">
                <img src="../img/album/mulher-gato.jpg" alt="Mulher Gato">
            </a> 
            <a href="../img/album/poltrona-zoe-mulher-gato.jpg" class="gallery-items">
                <img src="../img/album/poltrona-zoe-mulher-gato.jpg" alt="Zoe Mulher Gato">
            </a> 
            <a href="../img/album/premiere-The-Batman.jpg" class="gallery-items">
                <img src="../img/album/premiere-The-Batman.jpg" alt="Prêmio The Batman">
            </a> 
            <a href="../img/album/Robert Pattinson.jpg" class="gallery-items">
                <img src="../img/album/Robert Pattinson.jpg" alt="Robert Pattinson">
            </a> 
            <a href="../img/album/The-Batman-2022.jpg" class="gallery-items">
                <img src="../img/album/The-Batman-2022.jpg" alt="The Batman 2022">
            </a> 
            <a href="../img/album/Batman.jpg" class="gallery-items">
                <img src="../img/album/Batman.jpg" alt="Batman">
            </a> 
            <a href="../img/album/the-batman.jpg" class="gallery-items">
                <img src="../img/album/the-batman.jpg" alt="the batman">
            </a> 
            <a href="../img/album/the-batman-2022-Mulher-Gato.jpg" class="gallery-items">
                <img src="../img/album/the-batman-2022-Mulher-Gato.jpg" alt="the-batman-2022-Mulher-Gato">
            </a> 
            <a href="../img/album/the-batman-2022-robert.jpg" class="gallery-items">
                <img src="../img/album/the-batman-2022-robert.jpg" alt="the-batman-2022-robert">
            </a>             
        </div>
    </main>
    <dialog class="image-viewer" aria-label="Visualização de imagem da galeria">
        <div class="image-viewer-content">
            <button class="image-viewer-close" type="button" aria-label="Voltar à galeria">Voltar à galeria</button>
            <button class="image-viewer-previous" type="button" aria-label="Ver imagem anterior">Anterior</button>
            <figure>
                <img class="image-viewer-image" src="" alt="">
                <figcaption class="image-viewer-caption"></figcaption>
            </figure>
            <button class="image-viewer-next" type="button" aria-label="Ver próxima imagem">Próxima</button>
            <p class="image-viewer-count" aria-live="polite"></p>
        </div>
    </dialog>
